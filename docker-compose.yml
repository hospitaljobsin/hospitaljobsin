services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    expose:
      - 80 # http
      - 443 # https
    volumes:
      - caddy_data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs/localtest.me.pem:/etc/caddy/certs/localtest.me.pem:ro
      - ./certs/localtest.me-key.pem:/etc/caddy/certs/localtest.me-key.pem:ro
    environment:
      - SEEKER_PORTAL_HOST=host.docker.internal
      - ACCOUNTS_HOST=host.docker.internal
      - SERVER_HOST=host.docker.internal
      - RECRUITER_PORTAL_CORE_HOST=host.docker.internal
      - RECRUITER_DASHBOARD_HOST=host.docker.internal
      - CMS_HOST=host.docker.internal

  mongodb:
    image: mongodb/mongodb-atlas-local:8.3.8
    ports:
      - "27017:27017"
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=user
      - MONGODB_INITDB_ROOT_PASSWORD=pass
      - RUNNER_LOG_FILE=/dev/stderr

  redis:
    image: redis:latest
    environment:
      - ALLOW_EMPTY_PASSWORD=yes # Note: official Redis does not support empty password, consider setting your own REDIS_PASSWORD
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


  mailcatcher:
    image: schickling/mailcatcher:latest
    ports:
      - "1080:1080"
      - "1025:1025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minio-access-key
      MINIO_ROOT_PASSWORD: minio-secret-key
      MINIO_DEFAULT_BUCKETS: medicaljobs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped


volumes:
  mongodb_data:
    driver: local
  minio_data:
    driver: local
  caddy_data:
    driver: local
  redis_data:
    driver: local
