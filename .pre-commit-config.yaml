repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: payload-types\.ts$
      - id: end-of-file-fixer
        exclude: payload-types\.ts$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=4000"]
        exclude: \.(yaml|lock|png|jpg|jpeg|gif|svg|webp|ico|bmp|tiff)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.0
    hooks:
      # Run the linter.
      # - id: ruff-check
      #   args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        files: ^server/.+\.py$
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.2.3 # Use the sha / tag you want to point at
    hooks:
      # - id: biome-check
      #   files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|css|svelte|vue|astro|graphql|gql)$"
      - id: biome-format
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|json|css|svelte|vue|astro|graphql|gql)$"
        exclude: ^(__generated__|.*/__generated__|.*payload-types\.ts)/
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.101.1
    hooks:
      - id: terraform_fmt
        files: ^infrastructure/.+\.tf$
      - id: terraform_tflint
        files: ^infrastructure/.+\.tf$
      - id: terraform_validate
        files: ^infrastructure/.+\.tf$
